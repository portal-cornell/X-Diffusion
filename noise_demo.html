<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X-Diffusion — Noise Demo</title>

  <!-- Load Inter inside the iframe -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    #noise-demo-iframe {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
      max-width: 100%;
    }

    #noise-demo-iframe #wrap {
      position: relative;
      display: inline-block;
      overflow: hidden;
      width: 100%;
      background: #fff;
    }

    #noise-demo-iframe img.bg {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity .15s ease;
      max-width: none;
    }

    #noise-demo-iframe svg.overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #noise-demo-iframe .track {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .95;
    }

    #noise-demo-iframe .pt {
      stroke-width: 3;
    }

    html,
    body {
      margin: 0;
    }

    /* Controls under the image */
    #ui {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: nowrap;
    }

    #ui .left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1 1 auto;
      min-width: 0;
    }

    #ui .right {
      flex: 0 0 auto;
    }

    #ui label {
      font-weight: 600;
      letter-spacing: .1px;
    }

    /* Slider styling */
    :root {
      --slider-h: 10px;
      --slider-radius: 999px;
      --slider-track: #e5e7eb;
      --slider-fill: #2563eb;
      --slider-thumb: #ffffff;
      --slider-thumb-bd: #c7d2fe;
      --slider-focus: rgba(37, 99, 235, .35);
    }

    #ui input[type="range"]#slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: var(--slider-h);
      background: transparent;
      outline: none;
      flex: 1 1 auto;
      min-width: 160px;
    }

    #ui input[type="range"]#slider::-webkit-slider-runnable-track {
      height: var(--slider-h);
      border-radius: var(--slider-radius);
      background: linear-gradient(90deg, var(--slider-fill) var(--_pct, 0%), var(--slider-track) 0);
    }

    #ui input[type="range"]#slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 2px solid var(--slider-thumb-bd);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
      margin-top: calc((var(--slider-h) - 18px)/2);
      transition: transform .12s ease;
    }

    #ui input[type="range"]#slider:hover::-webkit-slider-thumb {
      transform: scale(1.06);
    }

    #ui input[type="range"]#slider:active::-webkit-slider-thumb {
      transform: scale(1.1);
    }

    #ui input[type="range"]#slider::-moz-range-track {
      height: var(--slider-h);
      border-radius: var(--slider-radius);
      background: var(--slider-track);
    }

    #ui input[type="range"]#slider::-moz-range-progress {
      height: var(--slider-h);
      border-radius: var(--slider-radius);
      background: var(--slider-fill);
    }

    #ui input[type="range"]#slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: 2px solid var(--slider-thumb-bd);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
      transition: transform .12s ease;
    }

    #ui input[type="range"]#slider:hover::-moz-range-thumb {
      transform: scale(1.06);
    }

    #ui input[type="range"]#slider:active::-moz-range-thumb {
      transform: scale(1.1);
    }

    #ui input[type="range"]#slider:focus-visible {
      box-shadow: 0 0 0 6px var(--slider-focus);
      border-radius: 12px;
    }

    /* Modern checkbox */
    #ui input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      display: inline-block;
      position: relative;
      cursor: pointer;
      background-color: #fff;
      transition: all 0.15s ease;
      vertical-align: middle;
    }

    #ui input[type="checkbox"]:hover {
      border-color: #2563eb;
    }

    #ui input[type="checkbox"]:checked {
      background-color: #2563eb;
      border-color: #2563eb;
    }

    #ui input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 0px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    #ui input[type="checkbox"]:focus-visible {
      outline: 2px solid rgba(37, 99, 235, .35);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div id="noise-demo-iframe">
    <div id="wrap">
      <img id="bg" class="bg" src="media/prithwish_slide.png" alt="">
      <svg id="svg" class="overlay"></svg>
    </div>

    <div id="ui">
      <div class="left">
        <label for="slider">Noise:</label>
        <input id="slider" type="range" min="0" max="100" value="0" step="1">
      </div>
      <div class="right">
        <label><input id="toggleBg" type="checkbox" checked> Show background</label>
      </div>
    </div>
  </div>

  <script src="scripts/noise_demo.js"></script>
  <script>
    function sendHeight() {
      const root = document.getElementById('noise-demo-iframe');
      const h = root ? Math.ceil(root.getBoundingClientRect().height) : document.documentElement.scrollHeight;
      window.parent.postMessage({ id: 'noise-demo', height: h }, '*');
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
  </script>
</body>

</html>
